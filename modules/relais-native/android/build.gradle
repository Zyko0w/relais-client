plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.relaisnative'
version = '1.0.0'

android {
  namespace "expo.modules.relaisnative"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // OCR hors ligne (modèle latin embarqué : français, anglais, etc.)
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'androidx.core:core-ktx:1.13.1'
}
